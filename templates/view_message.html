{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('messages', folder=folder) }}">Messages</a></li>
            <li class="breadcrumb-item active">{{ message.subject }}</li>
        </ol>
    </nav>

    <div class="card">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">{{ message.subject }}</h5>
                <div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#replyModal">
                        <i class="bi bi-reply"></i> Reply
                    </button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <div>
                        <strong>From:</strong> {{ message.sender.name }}<br>
                        <strong>To:</strong> {{ message.recipient.name }}
                    </div>
                    <div class="text-muted">
                        {{ message.created_at.strftime('%Y-%m-%d %H:%M') }}
                    </div>
                </div>
            </div>
            <div class="message-body">
                {{ message.body|nl2br }}
            </div>
        </div>
    </div>
</div>

<!-- Reply Modal -->
<div class="modal fade" id="replyModal" tabindex="-1" aria-labelledby="replyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('send_message') }}">
                <input type="hidden" name="recipient_id" value="{{ message.sender.id }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="replyModalLabel">Reply to Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject:</label>
                        <input type="text" class="form-control" id="subject" name="subject" 
                               value="Re: {{ message.subject }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message:</label>
                        <textarea class="form-control" id="message" name="body" rows="5" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Send Reply</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
