{% extends "base.html" %}

{% block title %}Edit Resource{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-4">Edit Resource</h2>
                    
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" 
                                   value="{{ resource.title }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" 
                                      rows="4" required>{{ resource.description }}</textarea>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="type" class="form-label">Resource Type</label>
                                <select class="form-select" id="type" name="type" required>
                                    <option value="tutorial" {% if resource.resource_type == 'tutorial' %}selected{% endif %}>Tutorial</option>
                                    <option value="tool" {% if resource.resource_type == 'tool' %}selected{% endif %}>Tool</option>
                                    <option value="article" {% if resource.resource_type == 'article' %}selected{% endif %}>Article</option>
                                    <option value="project" {% if resource.resource_type == 'project' %}selected{% endif %}>Project</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="difficulty" class="form-label">Difficulty Level</label>
                                <select class="form-select" id="difficulty" name="difficulty" required>
                                    <option value="beginner" {% if resource.difficulty_level == 'beginner' %}selected{% endif %}>Beginner</option>
                                    <option value="intermediate" {% if resource.difficulty_level == 'intermediate' %}selected{% endif %}>Intermediate</option>
                                    <option value="advanced" {% if resource.difficulty_level == 'advanced' %}selected{% endif %}>Advanced</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="tags" class="form-label">Tags (comma-separated)</label>
                            <input type="text" class="form-control" id="tags" name="tags" 
                                   value="{{ resource.tags }}" placeholder="e.g. python, web development, api">
                        </div>
                        
                        <div class="mb-4">
                            <label for="file" class="form-label">Update File (optional)</label>
                            <input type="file" class="form-control" id="file" name="file">
                            {% if resource.files %}
                            <small class="text-muted">Current file: {{ resource.files[0].filename }}</small>
                            {% endif %}
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('view_resource', id=resource.id) }}" 
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
